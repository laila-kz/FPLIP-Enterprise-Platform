server {
    listen 80;
    listen 8443 ssl;
    server_name localhost;

    # TLS / SSL Termination Configuration
    ssl_certificate /etc/nginx/certs/cert.pem;
    ssl_certificate_key /etc/nginx/certs/key.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers HIGH:!aNULL:!MD5;

    # Global proxy header defaults
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # 1. FastAPI Serving Engine
    location /api/ {
        proxy_pass http://api:8000/;
    }

    # 2. Airflow Web UI
    location /airflow/ {
        proxy_pass http://airflow-webserver:8080/;
    }

    # 3. Laravel Operational Web App
    location /app/ {
        proxy_pass http://laravel:8081/;
    }

    # 4. Apache Superset BI Dashboards
    location /bi/ {
        proxy_pass http://host.docker.internal:8088/;
    }

    # 5. Reverse Proxy Healthcheck
    location /health {
        default_type application/json;
        return 200 '{"status":"ok","proxy":"nginx"}';
    }
}
