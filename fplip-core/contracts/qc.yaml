source_name: "qc"
description: "QC Inspection Log — transactional record of quality inspections"
owner: "Quality Department"
contact: "TBD"
update_frequency: "daily"
freshness_sla_hours: 24
confidence: "unconfirmed"

schema:
  - name: "inspection_id"
    type: "STRING"
    nullable: false
    description: "Surrogate identifier"
  - name: "production_run_reference"
    type: "STRING"
    nullable: true
    description: "Reference to Production Run Log"
  - name: "inspection_date"
    type: "DATE"
    nullable: false
    description: "Date of inspection"
  - name: "defect_type_id"
    type: "STRING"
    nullable: true
    description: "Defect found, if any"
  - name: "units_inspected"
    type: "INTEGER"
    nullable: false
    description: "Units in inspected sample/batch"
  - name: "units_rejected"
    type: "INTEGER"
    nullable: false
    description: "Units failing inspection"
  - name: "inspector_id"
    type: "STRING"
    nullable: true
    description: "Badge code of the inspector"
  - name: "data_entry_method"
    type: "STRING"
    nullable: false
    description: "Capture method: Manual, ERP Export"
  - name: "entered_by"
    type: "STRING"
    nullable: false
    description: "Badge code of transcriber"
  - name: "entered_at"
    type: "TIMESTAMP"
    nullable: false
    description: "Entry timestamp"